name: Node.js CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # These environment variables will be pulled from your GitHub Repo Secrets and Variables
    env:
      NODE_ENV: ${{ vars.NODE_ENV || 'production' }}
      APP_URL: ${{ vars.APP_URL || 'http://localhost:3000' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_PASSKEY: ${{ secrets.ADMIN_PASSKEY }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type check (Lint)
      run: npm run lint
      
    - name: Build full-stack application (Vite + Express)
      run: npm run build
      
    # Note: To deploy to a platform like Render, Railway, or Google Cloud Run, 
    # you would add your deployment steps/actions here.
